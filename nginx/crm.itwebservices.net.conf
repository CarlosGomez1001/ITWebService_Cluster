# Sitio nginx de PRODUCCIÓN (host: reverse-proxy del servidor)
# Puertos loopback del stack it (ver .env de producción):
#   backend 3000 | frontend-prod 8081 | notifications 3002

# Necesario para el upgrade del WebSocket de Socket.io (contexto http).
# Nombre propio para no chocar con otro map que ya exista en el servidor.
map $http_upgrade $it_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name crm.itwebservices.net;

    location = /google89fef36cfe45ab23.html {
        root /var/www/crm-legal;
        try_files /google89fef36cfe45ab23.html =404;
        default_type text/html;
    }

    location = /oauth-app {
        root /var/www/crm-legal;
        try_files /oauth-app.html =404;
        default_type text/html;
    }

    location = /privacy {
        root /var/www/crm-legal;
        try_files /privacy.html =404;
        default_type text/html;
    }

    location = /terms {
        root /var/www/crm-legal;
        try_files /terms.html =404;
        default_type text/html;
    }

    # ── Notifications: rutas servicio-a-servicio (solo las usa el backend por la red Docker) ──
    location ~ ^/api/notifications/(send|send-bulk|broadcast)/?$ {
        return 404;
    }

    # ── Notifications: REST del usuario (el microservicio valida el JWT de notificaciones) ──
    location /api/notifications {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ── Notifications: WebSocket (Socket.io, path personalizado) ──
    location /notifications/socket.io {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $it_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Backend PHP ──
    location /index.php {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Refresh-Token $http_x_refresh_token;
    }

    # ── Frontend (build estático) ──
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/crm.itwebservices.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crm.itwebservices.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = crm.itwebservices.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name crm.itwebservices.net;
    return 404; # managed by Certbot
}
