# IT Web Service Cluster - Docker Compose
# Unified configuration for Frontend + Backend + future microservices
#
# Usage:
#   Development:  docker-compose --profile dev up -d
#   Production:   docker-compose --profile prod up -d
#   All services: docker-compose --profile dev --profile prod up -d

services:
  # =============================================================================
  # BACKEND - PHP 8.2 + Apache + SQL Server ODBC
  # =============================================================================
  backend:
    build:
      context: ./it_web_service-Backend_R
      dockerfile: Dockerfile
    container_name: it-backend
    ports:
      # Loopback-only: the standalone reverse-proxy (../reverse-proxy) is the
      # only intended consumer, reaching it via 127.0.0.1:${BACKEND_PORT}.
      - "127.0.0.1:${BACKEND_PORT:-3000}:80"
    env_file:
      - ./it_web_service-Backend_R/.env
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    volumes:
      - ./it_web_service-Backend_R:/var/www/html
      - backend_vendor:/var/www/html/vendor
    networks:
      - it-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/index.php" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # FRONTEND DEVELOPMENT - Vite Dev Server (hot reload)
  # =============================================================================
  frontend-dev:
    profiles: [ "dev" ]
    build:
      context: ./it_web_service-Front
      dockerfile: Dockerfile
    container_name: it-frontend-dev
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./it_web_service-Front:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://backend:80
    command: npm run dev -- --host --force
    networks:
      - it-network
    depends_on:
      - backend

  # =============================================================================
  # FRONTEND PRODUCTION - Nginx serving static build
  # =============================================================================
  frontend-prod:
    profiles: [ "prod" ]
    build:
      context: ./it_web_service-Front
      dockerfile: Dockerfile.prod
    container_name: it-frontend-prod
    ports:
      # 80/443 are owned by the standalone reverse-proxy (../reverse-proxy).
      # This publishes only to loopback so the proxy can reach it via
      # 127.0.0.1:${FRONTEND_PROD_PORT} without exposing it directly.
      - "127.0.0.1:${FRONTEND_PROD_PORT:-8081}:80"
    environment:
      - NODE_ENV=production
    networks:
      - it-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # MICROSERVICE - NOTIFICATIONS (Node.js + Socket.io + MongoDB)
  # =============================================================================
  notifications:
    profiles: [ "notifications", "microservices" ]
    build:
      context: ./microservices/notifications
      dockerfile: Dockerfile
    container_name: it-ms-notifications
    ports:
      - "127.0.0.1:${MS_NOTIFICATIONS_PORT:-3002}:3002"
    environment:
      - PORT=3002
      - NODE_ENV=${NODE_ENV:-development}
      - MONGO_URI=mongodb://mongo-notifications:27017/notifications
      - API_KEY=${NOTIFICATIONS_API_KEY:-changeme-generate-a-secure-key}
      - CORS_ORIGINS=${NOTIFICATIONS_CORS_ORIGINS:-http://localhost:5173,http://localhost:80}
    networks:
      - it-network
    depends_on:
      mongo-notifications:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/notifications/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =============================================================================
  # MONGODB - Base de datos para Notifications
  # =============================================================================
  mongo-notifications:
    profiles: [ "notifications", "microservices" ]
    image: mongo:7-jammy
    container_name: it-mongo-notifications
    ports:
      - "${MONGO_NOTIFICATIONS_PORT:-27017}:27017"
    volumes:
      - mongo_notifications_data:/data/db
    networks:
      - it-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # =============================================================================
  # MICROSERVICE - FORMATS AND MAIL (PHP 8.2 + Apache)
  # =============================================================================
  formatsandmail:
    profiles: [ "formatsandmail", "microservices" ]
    build:
      context: ./microservices/FormatsAndMails
      dockerfile: Dockerfile
    container_name: it-ms-formatsandmail
    ports:
      - "127.0.0.1:${MS_FORMATSANDMAIL_PORT:-3001}:80"
    env_file:
      - ./microservices/FormatsAndMails/.env
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    volumes:
      - ./microservices/FormatsAndMails:/var/www/html
      - formatsandmail_vendor:/var/www/html/vendor
      - formatsandmail_cache:/var/www/formatos
    networks:
      - it-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/index.php/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # MICROSERVICE - AUTH SERVICE (PHP 8.2 + Apache + SQL Server ODBC)
  # =============================================================================
  authservice:
    profiles: [ "authservice", "microservices" ]
    build:
      context: ./microservices/AuthService
      dockerfile: Dockerfile
    container_name: it-ms-authservice
    ports:
      - "127.0.0.1:${MS_AUTH_PORT:-3003}:80"
    env_file:
      - ./microservices/AuthService/.env
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    volumes:
      - ./microservices/AuthService:/var/www/html
      - authservice_vendor:/var/www/html/vendor
    networks:
      - it-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/index.php/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  # =============================================================================
  # FUTURE MICROSERVICES - Templates
  # =============================================================================
  # redis:
  #   profiles: ["microservices", "cache"]
  #   image: redis:7-alpine
  #   container_name: it-redis
  #   ports:
  #     - "${REDIS_PORT:-6379}:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - it-network
  #   restart: unless-stopped

  # =============================================================================
  # NETWORKS
  # =============================================================================
networks:
  it-network:
    driver: bridge
    name: it-web-service-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  backend_vendor:
    name: it-backend-vendor
  frontend_node_modules:
    name: it-frontend-node-modules
  mongo_notifications_data:
    name: it-mongo-notifications-data
  formatsandmail_vendor:
    name: it-formatsandmail-vendor
  authservice_vendor:
    name: it-authservice-vendor
  formatsandmail_cache:
    name: it-formatsandmail-cache
  # redis_data:
  #   name: it-redis-data
