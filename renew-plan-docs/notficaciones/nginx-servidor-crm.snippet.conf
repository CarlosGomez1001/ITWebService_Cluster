# =============================================================================
# Snippet para el nginx del SERVIDOR (reverse-proxy standalone, fuera de este repo)
# Dominio: crm.itwebservices.net  (front + backend + notificaciones comparten host)
#
# Pegar DENTRO del bloque `server { ... }` de crm.itwebservices.net (el de 443/TLS),
# junto a la regla que ya envía `/index.php` al backend.
# El microservicio se publica en loopback del host: 127.0.0.1:${MS_NOTIFICATIONS_PORT:-3002}.
# =============================================================================

# --- (1) En el contexto `http { ... }`, una sola vez (si no existe ya) ---------
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

# --- (2) Dentro del `server { ... }` -----------------------------------------

# Rutas servicio-a-servicio (API key): las usa SOLO el backend por la red Docker.
# Jamás deben ser alcanzables desde internet.
location ~ ^/api/notifications/(send|send-bulk|broadcast)/?$ {
    return 404;
}

# REST de notificaciones del usuario (JWT de notificaciones, validado por el microservicio)
location /api/notifications {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# WebSocket / long-polling de Socket.io (path personalizado). El socket se cierra y reconecta
# solo cada ~15 min (renovación del token), por eso un timeout largo es suficiente.
location /notifications/socket.io/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
}
