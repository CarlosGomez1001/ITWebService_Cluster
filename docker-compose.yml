# IT Web Service Cluster - Docker Compose
# Unified configuration for Frontend + Backend + future microservices
#
# Usage:
#   Development:  docker-compose --profile dev up -d
#   Production:   docker-compose --profile prod up -d
#   All services: docker-compose --profile dev --profile prod up -d

services:
  # =============================================================================
  # BACKEND - PHP 8.2 + Apache + SQL Server ODBC
  # =============================================================================
  backend:
    build:
      context: ./services/ITwebService_Back
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-it}-backend-lnx
    ports:
      # Loopback-only: the standalone reverse-proxy (../reverse-proxy) is the
      # only intended consumer, reaching it via 127.0.0.1:${BACKEND_PORT}.
      - "127.0.0.1:${BACKEND_PORT:-4006}:80"
    env_file:
      - ./services/ITwebService_Back/.env
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    volumes:
      - ./services/ITwebService_Back:/var/www/html
      - backend_vendor:/var/www/html/vendor
    networks:
      - it-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/index.php" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # FRONTEND DEVELOPMENT - Vite Dev Server (hot reload)
  # =============================================================================
  frontend-dev:
    profiles: [ "dev" ]
    build:
      context: ./services/ITwebService_Front
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-it}-frontend-dev-lnx
    ports:
      - "${FRONTEND_DEV_PORT:-5174}:5173"
    volumes:
      - ./services/ITwebService_Front:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # La consume el navegador, no el contenedor: debe ser una URL alcanzable desde el host.
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-4006}/index.php
      # Microservicio de notificaciones publicado en loopback; también lo consume el navegador.
      - VITE_NOTIFICATIONS_URL=http://localhost:${MS_NOTIFICATIONS_PORT:-4002}
    command: npm run dev -- --host --force
    networks:
      - it-network
    depends_on:
      - backend

  # =============================================================================
  # FRONTEND PRODUCTION - Nginx serving static build
  # =============================================================================
  frontend-prod:
    profiles: [ "prod" ]
    build:
      context: ./services/ITwebService_Front
      dockerfile: Dockerfile.prod
      args:
        # Se incrusta en el bundle en build time (Vite); cambiarla requiere --build.
        VITE_API_URL: ${VITE_API_URL:?Define VITE_API_URL en .env}
        # Vacío = mismo origen (front y microservicio comparten host; el proxy enruta /api/notifications
        # y /notifications/socket.io). Solo definirla si el microservicio vive en otro origen.
        VITE_NOTIFICATIONS_URL: ${VITE_NOTIFICATIONS_URL:-}
    container_name: ${STACK_NAME:-it}-frontend-prod-lnx
    ports:
      # 80/443 are owned by the standalone reverse-proxy (../reverse-proxy).
      # This publishes only to loopback so the proxy can reach it via
      # 127.0.0.1:${FRONTEND_PROD_PORT} without exposing it directly.
      - "127.0.0.1:${FRONTEND_PROD_PORT:-9081}:80"
    environment:
      - NODE_ENV=production
    networks:
      - it-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # MICROSERVICE - NOTIFICATIONS (Node.js + Socket.io + MongoDB)
  # =============================================================================
  notifications:
    profiles: [ "notifications", "microservices" ]
    build:
      context: ./services/microservices/notifications_service
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-it}-ms-notifications
    ports:
      - "127.0.0.1:${MS_NOTIFICATIONS_PORT:-4002}:3002"
    environment:
      - PORT=4002
      - NODE_ENV=${NODE_ENV:-development}
      - MONGO_URI=mongodb://${MONGO_NOTIFICATIONS_USER:?Define MONGO_NOTIFICATIONS_USER en .env}:${MONGO_NOTIFICATIONS_PASSWORD:?Define MONGO_NOTIFICATIONS_PASSWORD en .env}@mongo-notifications:27017/notifications?authSource=admin
      - API_KEY=${NOTIFICATIONS_API_KEY:?Define NOTIFICATIONS_API_KEY en .env (openssl rand -hex 32)}
      # Secreto con el que el BACKEND firma el token de notificaciones del navegador. Debe ser el mismo
      # NOTIFICATIONS_JWT_SECRET del .env del backend, distinto de SEC_KEY y de NOTIFICATIONS_API_KEY.
      - NOTIFICATIONS_JWT_SECRET=${NOTIFICATIONS_JWT_SECRET:?Define NOTIFICATIONS_JWT_SECRET en .env (openssl rand -hex 32)}
      - CORS_ORIGINS=${NOTIFICATIONS_CORS_ORIGINS:-http://localhost:5174,http://localhost:80}
    networks:
      - it-network
    depends_on:
      mongo-notifications:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4002/notifications/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =============================================================================
  # MONGODB - Base de datos para Notifications
  # =============================================================================
  mongo-notifications:
    profiles: [ "notifications", "microservices" ]
    image: mongo:7-jammy
    container_name: ${STACK_NAME:-it}-mongo-notifications
    ports:
      # Loopback-only: accesible desde el host (mongosh/Compass) pero no desde la red.
      - "127.0.0.1:${MONGO_NOTIFICATIONS_PORT:-27018}:27017"
    environment:
      # Activa --auth. El usuario solo se crea si el volumen está vacío;
      # con un volumen existente hay que crearlo a mano (ver DOCKER.md).
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_NOTIFICATIONS_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_NOTIFICATIONS_PASSWORD}
    volumes:
      - mongo_notifications_data:/data/db
    networks:
      - it-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # =============================================================================
  # MICROSERVICE - FORMATS AND MAIL (PHP 8.2 + Apache)
  # =============================================================================
  formatsandmail:
    profiles: [ "formatsandmail", "microservices" ]
    build:
      context: ./services/microservices/FormatsAndMails
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-it}-ms-formatsandmail
    ports:
      - "127.0.0.1:${MS_FORMATSANDMAIL_PORT:-4001}:80"
    env_file:
      - ./services/microservices/FormatsAndMails/.env
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    volumes:
      - ./services/microservices/FormatsAndMails:/var/www/html
      - formatsandmail_vendor:/var/www/html/vendor
      - formatsandmail_cache:/var/www/formatos
    networks:
      - it-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/index.php/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # MICROSERVICE - AUTH SERVICE (PHP 8.2 + Apache + SQL Server ODBC)
  # =============================================================================
  authservice:
    profiles: [ "authservice", "microservices" ]
    build:
      context: ./services/microservices/AuthService
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-it}-ms-authservice
    ports:
      - "127.0.0.1:${MS_AUTH_PORT:-4003}:80"
    env_file:
      - ./services/microservices/AuthService/.env
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    volumes:
      - ./services/microservices/AuthService:/var/www/html
      - authservice_vendor:/var/www/html/vendor
    networks:
      - it-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/index.php/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  # =============================================================================
  # MICROSERVICE - AI SERVICE (Node.js + TypeScript + OpenAI)
  # =============================================================================
  ai-service:
    profiles: [ "ai-service", "microservices" ]
    build:
      context: ./services/microservices/ai-insights-service
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-it}-ms-ai-service
    ports:
      # Loopback-only, igual que el resto de microservicios: solo el backend
      # PHP (dentro de la red Docker) o un curl local deben alcanzarlo. Este
      # servicio nunca lleva CORS habilitado ni debe ser llamado desde React.
      - "127.0.0.1:${MS_AI_PORT:-4005}:3005"
    env_file:
      - ./services/microservices/ai-insights-service/.env
    environment:
      - PORT=4005
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - it-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/ai/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =============================================================================
  # FUTURE MICROSERVICES - Templates
  # =============================================================================
  # redis:
  #   profiles: ["microservices", "cache"]
  #   image: redis:7-alpine
  #   container_name: it-redis
  #   ports:
  #     - "${REDIS_PORT:-6379}:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - it-network
  #   restart: unless-stopped

  # =============================================================================
  # NETWORKS
  # =============================================================================
networks:
  it-network:
    driver: bridge
    name: ${STACK_NAME:-it}-web-service-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  backend_vendor:
    name: ${STACK_NAME:-it}-backend-vendor
  frontend_node_modules:
    name: ${STACK_NAME:-it}-frontend-node-modules
  mongo_notifications_data:
    name: ${STACK_NAME:-it}-mongo-notifications-data
  formatsandmail_vendor:
    name: ${STACK_NAME:-it}-formatsandmail-vendor
  authservice_vendor:
    name: ${STACK_NAME:-it}-authservice-vendor
  formatsandmail_cache:
    name: ${STACK_NAME:-it}-formatsandmail-cache
  # redis_data:
  #   name: it-redis-data
